x-cassandra: &cassandras
  CASSANDRA_CLUSTER_NAME: TaxiCluster
  CASSANDRA_SEEDS: cassandra1, cassandra2, cassandra3, cassandra4 # every node for availability
  HEAP_NEWSIZE: 256M # these are max values our cloud deployment machines can handle
  MAX_HEAP_SIZE: 4G # these are max values our cloud deployment machines can handle
  CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
    
x-expose: &exposes
    - "7000" # intra-node communication
    - "7001" # TLS intra node communication
    - "7199" # JMX
    - "9042" # CQL
    - "9142" # CQL TLS
    - "9160" # Thrift
services: 
  cassandra1:
    image: cassandra:latest
    hostname: cassandra1
    environment: 
      <<: *cassandras
      CASSANDRA_DC: DC1
    volumes:
      - cassandra1-data:/var/lib/cassandra
    expose: *exposes
    ports: 
      - "9042:9042"
    restart: always

  cassandra2:
    image: cassandra:latest
    hostname: cassandra2
    environment: 
      <<: *cassandras
      CASSANDRA_DC: DC1   
    expose: *exposes
    volumes:
      - cassandra2-data:/var/lib/cassandra
    ports: 
      - "9043:9042"
    restart: always
    depends_on: 
      - cassandra1
    

  cassandra3:
    image: cassandra:latest
    hostname: cassandra3
    environment: 
      <<: *cassandras
      CASSANDRA_DC: DC2
    volumes:
      - cassandra3-data:/var/lib/cassandra
    expose: *exposes
    restart: always
    ports: 
      - "9044:9042"

  cassandra4:
    image: cassandra:latest
    hostname: cassandra4
    environment: 
      <<: *cassandras
      CASSANDRA_DC: DC2
    volumes:
      - cassandra4-data:/var/lib/cassandra
    expose: *exposes
    restart: always
    depends_on: 
      - cassandra3    
    ports: 
      - "9045:9042"
      
volumes:
  cassandra1-data:
  cassandra2-data:
  cassandra3-data:
  cassandra4-data:
